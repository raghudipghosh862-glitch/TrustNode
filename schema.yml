components:
  schemas:
    Bounty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
          readOnly: true
        title:
          type: string
          maxLength: 255
        success_criteria:
          type: string
          description: Strict instructions for the AI reviewer
        escrow_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        paypal_order_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - escrow_amount
      - id
      - paypal_order_id
      - status
      - submissions
      - success_criteria
      - title
    PatchedBounty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
          readOnly: true
        title:
          type: string
          maxLength: 255
        success_criteria:
          type: string
          description: Strict instructions for the AI reviewer
        escrow_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        paypal_order_id:
          type: string
          readOnly: true
          nullable: true
    PatchedSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        developer_paypal_email:
          type: string
          format: email
          description: Where the AI sends the payout
          maxLength: 254
        code_content:
          type: string
        ai_status:
          type: string
          readOnly: true
        ai_feedback:
          type: string
          readOnly: true
          nullable: true
        bounty:
          type: integer
    StatusEnum:
      enum:
      - open
      - funded
      - completed
      type: string
      description: |-
        * `open` - Open
        * `funded` - Funded (In Escrow)
        * `completed` - Completed
    Submission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        developer_paypal_email:
          type: string
          format: email
          description: Where the AI sends the payout
          maxLength: 254
        code_content:
          type: string
        ai_status:
          type: string
          readOnly: true
        ai_feedback:
          type: string
          readOnly: true
          nullable: true
        bounty:
          type: integer
      required:
      - ai_feedback
      - ai_status
      - bounty
      - code_content
      - developer_paypal_email
      - id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
