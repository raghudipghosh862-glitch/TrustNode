<!DOCTYPE html>
<html lang="en">
<head>
    <title>TrustNode Payout Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>
<body>
    <h2>TrustNode AI Evaluations</h2>
    <div id="myGrid" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>

    <script>
        const gridOptions = {
            columnDefs: [
                { field: "id", headerName: "ID", width: 70 },
                { field: "bounty", headerName: "Bounty ID" },
                { field: "developer_paypal_email", headerName: "Developer Email" },
                { field: "ai_status", headerName: "Status" },
                { field: "payout_batch_id", headerName: "Payout Batch" }
            ],
            defaultColDef: { sortable: true, filter: true }
        };

        const gridDiv = document.querySelector('#myGrid');
        new agGrid.Grid(gridDiv, gridOptions);

        // Fetch data directly from your local DRF endpoint
        fetch('/api/submissions/')
            .then(response => response.json())
            .then(data => {
                gridOptions.api.setRowData(data);
            });
    </script>
</body>
</html>
